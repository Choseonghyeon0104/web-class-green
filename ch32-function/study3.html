<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값의 형태로 정의하는 함수</title>
</head>
<body>
    <script>
        function a(){
            alert("aaa");
        }
        // function a는 a라는 변수라는 공간 안에 함수를 만든 것으로 간주된다.
        let b = function(){
            alert("bbb")
        } // <-이름없는 함수를 "익명함수"라고 함
        b()
        let c = ()=>{
            alert("ccc")
        }
        c()

        function d(n1){
            alert(n1)
        }
        d("ddd")

        let e=function(n1){
            alert(n1)
        }
        e("eee")

        // 화살표 함수 안에 매개변수가 1개 일 땐 ()소괄호 생략 가능
        let f = n1=>{
            alert(n1)
        }
        f("fff")

        // {}중괄호 안에 return키워드가 사용되는 소스코드가 한줄이라면 중괄호와 return키워드를 생략 할 수가 있다.
        let g = (a,b)=>[a,b]
        alert(g(1,3))
    </script>

    <h1>콜백함수</h1>
    <script>
        function aa(bb){
            bb()
        }
        aa(function(){
            alert("bb")
        })

        let cc = dd=>{
            dd()
        }
        cc(()=>{
            alert("dd")
        })
    </script>
</body>
</html>
