<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <script>
        let a = ["사과","배","귤","수박"] // 배열을 할 때 []대괄호 안에 콤마로 구분, 안에 들어가 있는 요소들을 "원소"라고 함
        //왼쪽부터 0,1,2,3...번째 원소라고 부른다.
        a[0] // <-순번 대괄호,인덱스 박스라고 하며 배열의 n번째 원소를 불러온다는 의미, 없는 번호는 undefind로 뜬다.
        console.log(a[0][1]) // a 안의 0번째 원소의 1번째 단어를 의미, "과"가 나옴
        console.log(a[2])
        console.log(a.length) // 원소가 4개인 배열 데이터이기 때문에 4가 나옴

        let b = [
            1,
            2,
            3,
            4
        ][3] // 배열 안에 3번째 요소를 가리키는 걸 변수b에 저장한다.
        console.log(b)
        let c = [
            "장윤서",
            "이은지",
            "김선영",
            "김가희",
            "최예슬"
        ]
        c[0] // "장윤서"
        c[4] // "최예슬"
        c[1].length // 3
        c[2][1]+c[3][2] // "선희"
        console.log((!c[3]||!c[4]||c[1])[0]) // "이"
        

        let d = 0||0||1 // 0||0||0 이면 0이 저장된다.
        console.log(d)

        let person1 = ["정현진","남자","infp",170,77,false,["게임","독서","러닝"]]
        person1[0] // "정현진"
        person1[3] // 170
        person1[5]?"기혼":"미혼" // "미혼"
        person1[6][2][1] // "닝"



    </script>
</body>
</html>
