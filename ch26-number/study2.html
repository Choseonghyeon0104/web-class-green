<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학관련도구(함수)</title>
</head>
<body>
    <h1>수학 계산 함수</h1>
    <script>
        console.log(Math.ceil(5.33)) // 올림
        console.log(Math.floor(5.9)) // 내림
        console.log(Math.round(5.5)) // 반올림
        console.log(Math.pow(10,3)) // 제곱 -> 10의3승
        console.log(Math.sqrt(100)) // 제곱근
        console.log(Math.abs(-30)) // 절대값 계산 함수
        console.log(Math.max(1,2,3,4,5,6)) // 가장 높은 값을 지정
        console.log(Math.min(1,2,3,4,5,6)) // 가장 낮은 값을 지정
        console.log(Math.random()) // 0부터 1까지 무작위 값을 제공
        console.log(123.333231423.toFixed(3)) // 소수점 ()자리까지 보이게 함 -> 문자데이터로 변환되어 보임
    </script>
</body>
</html>
