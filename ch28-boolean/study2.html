<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼항연산자</title>
</head>
<body>
    <script>
        10>2 ? "A" : "B" // ? 앞에 함수가 true일 때는 ? 뒤에 함수가 계산되고, false면 : 뒤에 함수가 계산되어 나온다. 때문에 왼쪽 값은 true임으로 "A"가 나온다.
        5<3 ? "가" : "나" // "나"
        10!=10 ? "다" : "라" // "라"
        20 ? "C" : "D" // "C"
        !0 ? "E" : "F" // "E"
        30<20 ? "A" : 5==5 ? "C" : "D"
        
        let score = 40
        score>=90 ? "A" : score>=80 ? "B" :score>= 70 ? "C" : "D"
        
    </script>
</body>
</html>
